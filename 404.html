<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Surco en blanco · Aguja Roja Mastering</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Fraunces:opsz,wght@9..144,500&family=JetBrains+Mono:wght@500&display=swap"

  />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <style>
    body {
      display: grid;
      place-items: center;
      padding: 2rem;
      text-align: center;
    }
    .error-sleeve {
      max-width: 480px;
      padding: 2.5rem 2rem;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-brass);
      box-shadow: var(--shadow-cabinet);
    }
    .error-code {
      font-family: var(--font-mono);
      color: var(--oxblood-bright);
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      margin-bottom: 0.75rem;
    }
    .error-sleeve h1 {
      font-size: 2rem;
      color: var(--parchment-light);
      margin-bottom: 0.85rem;
    }
    .error-sleeve p {
      color: var(--text-secondary);
      margin-inline: auto;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <main class="error-sleeve walnut-surface">
    <div class="error-code">ERROR 404 · AGUJA ROJA</div>
    <h1>La aguja cayó en un surco vacío.</h1>
    <p>
      Esta pista no existe en esta edición. Regresa a la consola principal de Aguja Roja para escuchar las comparaciones A/B de mezcla y máster.
